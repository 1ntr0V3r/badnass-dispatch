# BADNASS Dispatch Platform — Production nginx configuration
# TLS 1.3 termination, rate limiting, security hardening, reverse proxy

worker_processes auto;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── Security: Hide server identity ────────────────────────────────────
    server_tokens off;
    more_clear_headers Server;

    # ── Rate Limiting ─────────────────────────────────────────────────────
    # 10 req/s per IP — protects against brute force and DDoS
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── TLS Configuration ─────────────────────────────────────────────────
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;

    # ── GZIP Compression ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/plain text/css;

    # ── Upstream: FastAPI application ─────────────────────────────────────
    upstream fastapi_app {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS Redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS Virtual Host ────────────────────────────────────────────────
    server {
        listen 8443 ssl http2;
        server_name _;

        # TLS Certificates (mounted from Docker secret or volume)
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # ── Request Limits ─────────────────────────────────────────────
        client_max_body_size 100k;
        client_body_timeout  10s;
        client_header_timeout 10s;
        send_timeout         30s;
        keepalive_timeout    65s;

        # ── Security Headers ───────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

        # ── Rate Limiting ──────────────────────────────────────────────
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        # ── Deny sensitive paths ───────────────────────────────────────
        location ~* /\.(env|git|venv|gitignore)$ {
            deny all;
            return 404;
        }

        # ── Health check (internal use) ────────────────────────────────
        location /health {
            proxy_pass http://fastapi_app;
            access_log off;
        }

        # ── API Reverse Proxy ──────────────────────────────────────────
        location /api/ {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Remove sensitive upstream headers
            proxy_hide_header X-Powered-By;
            proxy_hide_header Server;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }

        # ── Deny everything else ───────────────────────────────────────
        location / {
            return 404;
        }
    }
}
